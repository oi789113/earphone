name: Render and publish earphone knot film

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "source/**"

permissions:
  contents: write

concurrency:
  group: earphone-knot-release
  cancel-in-progress: false

jobs:
  render-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system codecs and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc

      - name: Install Python rendering dependencies
        run: python -m pip install --no-cache-dir numpy opencv-python-headless pillow scipy brotli

      - name: Restore original renderer and verify SHA-256
        run: |
          python - <<'PY'
          import base64, brotli, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'source/part{i:02d}.b64').read_text().strip() for i in range(1,6))
          assert len(encoded) == 11656, f'Encoded renderer is truncated: {len(encoded)}'
          code = brotli.decompress(base64.b64decode(encoded, validate=True))
          actual = hashlib.sha256(code).hexdigest()
          expected = '69635d78898848cbeb35a8bd3e3d966f0396a8ce62ec873e70c6ce2f5fe5f0b3'
          assert actual == expected, f'Renderer checksum mismatch: {actual}'
          Path('render.py').write_bytes(code)
          print('Original renderer restored and checksum verified', flush=True)
          PY

      - name: Render original 1920x1080, 60fps, 60-second film
        run: |
          mkdir -p out
          python -u render.py --out out/earphone-knots-1080p60.mp4

      - name: Create mobile edition and storyboard
        run: |
          ffmpeg -hide_banner -loglevel error -y -i out/earphone-knots-1080p60.mp4 -vf "scale=1280:720,fps=30" -c:v libx264 -preset veryfast -crf 29 -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart out/earphone-knots-mobile-720p30.mp4
          ffmpeg -hide_banner -loglevel error -y -i out/earphone-knots-1080p60.mp4 -vf "fps=1/5,scale=320:180,tile=4x3" -frames:v 1 -update 1 out/storyboard.jpg
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,r_frame_rate,codec_name -of default=noprint_wrappers=1 out/earphone-knots-1080p60.mp4

      - name: Publish GitHub Release with downloadable MP4 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 && gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 \
            out/earphone-knots-1080p60.mp4 \
            out/earphone-knots-mobile-720p30.mp4 \
            out/storyboard.jpg \
            --title "耳机线为什么会自己打结｜1080P 60FPS" \
            --notes "60秒、16:9、1920×1080、60FPS原创科学动画。提供完整版MP4、720P手机版以及分镜总览。此仓库与世界历史项目完全独立。"

      - name: Save fallback downloadable workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earphone-knot-video-download
          path: out/
          if-no-files-found: warn
          retention-days: 30
